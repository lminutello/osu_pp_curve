name: Refresh ranks (weekly)

# Ranks on the site are looked up from real players' current (pp, global rank). This re-pulls ~2,000 players spread
# over every pp level (data/rank_ids.json) plus the real top 10,000, and updates data/model.json.
# Estimated time: ~40 minutes (2,000 players at ~1 per second).
on:
  schedule:
    - cron: "17 8 * * 1"      # Mondays, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install "numpy>=1.26,<3"

      - name: Pull ranks
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python scripts/pull_leaderboard.py
          python scripts/ranks.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly rank refresh ($(date -u +%Y-%m-%d))"
            git pull --rebase -q origin main
            git push
          fi
