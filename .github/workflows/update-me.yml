name: Update my stats

# Saves sakul333's current pp, play time and rank to data/me.json for the site's "my stats" button, and adds a point
# to data/me_history.json for the "My progress" curve (plus a rebuild of the past from dated top plays).
# Three API requests a day. Uses the same OSU_CLIENT_ID / OSU_CLIENT_SECRET secrets as the history pull,
# and does nothing if they aren't set. Change the player with a repository variable named OSU_USERNAME.
# Estimated time: under 1 minute.
on:
  schedule:
    - cron: "41 9 * * *"      # daily, 09:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install "numpy>=1.26,<3"

      - name: Look up the player
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          OSU_USERNAME: ${{ vars.OSU_USERNAME }}
        run: python scripts/update_me.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/me.json data/me_history.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update my stats ($(date -u +%Y-%m-%d))" && git pull --rebase -q origin main && git push; fi
